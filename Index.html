  <meta name="theme-color" content="#DF546A">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f2ede8; min-height: 100vh; padding: 0 0 3rem; }
    .hero { background: #fff; padding: 2rem 1.5rem 0; text-align: center; border-bottom: 0.5px solid #e8e0d8; }
    .hero-greeting { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #D7B29A; margin-bottom: 4px; }
    .hero-date { font-size: 22px; font-weight: 500; color: #85566B; margin-bottom: 1rem; }
    .hero-avatar { width: 130px; height: 130px; object-fit: contain; display: block; margin: 0 auto; padding-bottom: 12px; }
    .stats-bar { background: #fff; border-bottom: 0.5px solid #e8e0d8; display: flex; }
    .stat-item { flex: 1; padding: 14px 12px; text-align: center; border-right: 0.5px solid #e8e0d8; }
    .stat-item:last-child { border-right: none; }
    .stat-value { font-size: 24px; font-weight: 500; color: #85566B; line-height: 1; margin-bottom: 3px; }
    .stat-value.streak { color: #DF546A; }
    .stat-label { font-size: 11px; color: #D7B29A; text-transform: uppercase; letter-spacing: 0.05em; }
    .nudge-wrap { padding: 1rem 1.25rem 0; }
    .nudge { background: #fff8ee; border-left: 3px solid #F7C57C; border-radius: 0 8px 8px 0; padding: 10px 14px; font-size: 13px; color: #85566B; line-height: 1.5; }
    .form-wrap { padding: 1rem 1.25rem; }
    .section-label { font-size: 11px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: #D7B29A; margin-bottom: 10px; }
    .card { background: #fff; border: 0.5px solid #e8e0d8; border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
    .card-row { padding: 14px 16px; border-bottom: 0.5px solid #f4eeea; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .card-row:last-child { border-bottom: none; }
    .row-label { font-size: 14px; color: #85566B; }
    .row-hint { font-size: 11px; color: #D7B29A; margin-top: 2px; }
    .toggle-pair { display: flex; gap: 6px; }
    .tog { padding: 7px 16px; border: 0.5px solid #D7B29A; border-radius: 20px; background: #fff; font-size: 13px; color: #D7B29A; cursor: pointer; transition: all 0.15s; }
    .tog.yes { background: #C7D8D4; border-color: #C7D8D4; color: #2e5c55; font-weight: 500; }
    .tog.no  { background: #f4eeea; border-color: #D7B29A; color: #85566B; font-weight: 500; }
    .num-wrap { display: flex; align-items: center; gap: 6px; }
    .num-wrap input { width: 90px; padding: 8px 10px; border: 0.5px solid #D7B29A; border-radius: 8px; font-size: 15px; color: #85566B; background: #fdf9f6; text-align: right; outline: none; }
    .num-wrap input:focus { border-color: #85566B; background: #fff; }
    .num-unit { font-size: 13px; color: #D7B29A; min-width: 26px; }
    .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; background: #fff3e0; color: #85566B; margin-bottom: 12px; }
    .already-note { font-size: 12px; color: #85566B; background: #f4eeea; border-radius: 8px; padding: 7px 12px; margin-bottom: 10px; }
    .submit-btn { width: 100%; padding: 14px; background: #DF546A; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; margin-bottom: 10px; }
    .submit-btn:active { opacity: 0.85; transform: scale(0.99); }
    .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .sheet-btn { width: 100%; padding: 12px; background: #fff; color: #85566B; border: 0.5px solid #D7B29A; border-radius: 12px; font-size: 13px; cursor: pointer; }
    .sheet-btn:active { background: #f4eeea; }
    .success { display: none; text-align: center; padding: 2rem 1.25rem; }
    .success-circle { width: 64px; height: 64px; background: #C7D8D4; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 28px; color: #2e5c55; }
    .success-title { font-size: 18px; font-weight: 500; color: #85566B; margin-bottom: 6px; }
    .success-sub { font-size: 13px; color: #D7B29A; margin-bottom: 1.5rem; line-height: 1.6; }
    .success-sheet { width: 100%; padding: 12px; background: #fff; border: 0.5px solid #D7B29A; border-radius: 12px; font-size: 13px; color: #85566B; cursor: pointer; margin-bottom: 8px; }
    .edit-link { background: none; border: none; font-size: 12px; color: #D7B29A; cursor: pointer; text-decoration: underline; display: block; width: 100%; padding: 4px; }
  </style>
</head>

<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-value" id="stat-total">—</div>
    <div class="stat-label">Check-ins</div>
  </div>
  <div class="stat-item">
    <div class="stat-value streak" id="stat-streak">—</div>
    <div class="stat-label">Day streak</div>
  </div>
</div>

<div class="nudge-wrap">
  <div class="nudge" id="nudge">Loading your stats...</div>
</div>

<div class="form-wrap">
  <div id="form-area">
    <div id="month-end-badge" style="display:none; padding-top:12px;">
      <span class="badge">&#128197; Last day of the month</span>
    </div>
    <div id="already-banner" class="already-note" style="display:none; margin-top:10px;">
      Already logged today — submitting will update your entry.
    </div>
    <div style="padding-top: 14px;">
      <p class="section-label">Today's log</p>
    </div>
    <div class="card">
      <div class="card-row">
        <div class="row-label">Office today?</div>
        <div class="toggle-pair">
          <button class="tog" id="btn-yes" onclick="setOffice(true)">Yes</button>
          <button class="tog" id="btn-no"  onclick="setOffice(false)">No</button>
        </div>
      </div>
      <div class="card-row">
        <div>
          <div class="row-label">Weight</div>
          <div class="row-hint">Before breakfast</div>
        </div>
        <div class="num-wrap">
          <input type="number" id="weight" placeholder="0.0" step="0.1" min="0">
          <span class="num-unit">lbs</span>
        </div>
      </div>
    </div>
    <div id="savings-card" style="display:none;">
      <div class="card">
        <div class="card-row">
          <div>
            <div class="row-label">Savings this month</div>
            <div class="row-hint">Cumulative total</div>
          </div>
          <div class="num-wrap">
            <span class="num-unit" style="min-width:12px;">$</span>
            <input type="number" id="savings" placeholder="0" step="1" min="0" style="width:100px;">
          </div>
        </div>
      </div>
    </div>
    <button class="submit-btn" id="submit-btn" onclick="submitForm()">Log today</button>
    <button class="sheet-btn" onclick="openSheet()">Open Daily Log &#8599;</button>
  </div>

  <div class="success" id="success">
    <div class="success-circle">&#10003;</div>
    <p class="success-title" id="success-title">Logged!</p>
    <p class="success-sub"   id="success-sub"></p>
    <button class="success-sheet" onclick="openSheet()">Open Daily Log &#8599;</button>
    <button class="edit-link" onclick="showForm()">Edit entry</button>
  </div>
</div>

<script>
  var officeValue = null;
  var isLastDay   = false;
  var sheetUrl    = null;

  (function init() {
    var now = new Date();
    document.getElementById("hero-date").textContent = now.toLocaleDateString("en-US", {
      weekday: "short", month: "long", day: "numeric"
    });
    var lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    isLastDay   = now.getDate() === lastDay;
    if (isLastDay) {
      document.getElementById("month-end-badge").style.display = "block";
      document.getElementById("savings-card").style.display    = "block";
    }
    google.script.run
      .withSuccessHandler(function(stats) {
        document.getElementById("stat-total").textContent  = stats.total;
        document.getElementById("stat-streak").textContent = stats.streak;
        document.getElementById("nudge").textContent       = getNudge(stats.streak, stats.total);
      })
      .getStats();
    google.script.run
      .withSuccessHandler(function(entry) {
        if (!entry) return;
        document.getElementById("already-banner").style.display = "block";
        if (entry.inOffice !== null) setOffice(entry.inOffice);
        if (entry.weight  !== "")   document.getElementById("weight").value  = entry.weight;
        if (entry.savings !== "" && isLastDay) document.getElementById("savings").value = entry.savings;
      })
      .getTodayEntry();
    google.script.run
      .withSuccessHandler(function(url) { sheetUrl = url; })
      .getSheetUrl();
  })();

  function getNudge(streak, total) {
    if (total === 0)   return "Welcome! Log your first check-in to start your streak.";
    if (streak === 0)  return "No streak yet today — log now to get back on track.";
    if (streak === 1)  return "Day 1. Every streak starts somewhere. Show up again tomorrow.";
    if (streak < 4)    return "You've checked in " + streak + " days in a row. Keep the momentum going.";
    if (streak < 8)    return streak + " days straight. You're building a real habit now.";
    if (streak < 15)   return streak + " day streak. Consistency is the whole game — you're playing it.";
    if (streak < 30)   return streak + " days. Most people quit before this point. You didn't.";
    if (streak < 60)   return streak + " day streak. This is who you are now.";
    return streak + " days. Remarkable. Don't stop.";
  }

  function setOffice(val) {
    officeValue = val;
    document.getElementById("btn-yes").className = "tog" + (val  ? " yes" : "");
    document.getElementById("btn-no").className  = "tog" + (!val ? " no"  : "");
  }

  function openSheet() {
    if (sheetUrl) window.open(sheetUrl, "_blank");
  }

  function submitForm() {
    var btn = document.getElementById("submit-btn");
    btn.disabled    = true;
    btn.textContent = "Saving...";
    var data = {
      inOffice: officeValue,
      weight:   document.getElementById("weight").value,
      savings:  isLastDay ? document.getElementById("savings").value : null
    };
    google.script.run
      .withSuccessHandler(function(result) {
        var parts = [];
        if (officeValue !== null) parts.push(officeValue ? "In office" : "Remote");
        if (data.weight)  parts.push(parseFloat(data.weight).toFixed(1) + " lbs");
        if (data.savings) parts.push("$" + parseInt(data.savings).toLocaleString() + " saved");
        document.getElementById("form-area").style.display = "none";
        document.getElementById("success").style.display   = "block";
        document.getElementById("success-title").textContent = result.status === "updated" ? "Entry updated" : "Logged!";
        document.getElementById("success-sub").textContent   = parts.length ? parts.join("  ·  ") : "Logged with no values";
        google.script.run
          .withSuccessHandler(function(stats) {
            document.getElementById("stat-total").textContent  = stats.total;
            document.getElementById("stat-streak").textContent = stats.streak;
            document.getElementById("nudge").textContent       = getNudge(stats.streak, stats.total);
          })
          .getStats();
      })
      .withFailureHandler(function(err) {
        alert("Something went wrong: " + err.message);
        btn.disabled    = false;
        btn.textContent = "Log today";
      })
      .submitEntry(data);
  }

  function showForm() {
    document.getElementById("form-area").style.display = "block";
    document.getElementById("success").style.display   = "none";
    document.getElementById("submit-btn").disabled     = false;
    document.getElementById("submit-btn").textContent  = "Log today";
  }
</script>
</body>
</html>
